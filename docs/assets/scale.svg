<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
     aria-label="对数尺度上的搜索空间：2^22、2^32、2^39、2^52 对比 2^128 和 2^256，并注明真实比例画不出来">
<title>搜索空间的尺度（对数）</title>
<style>
  .bg{fill:#fbfaf8}
  .t{fill:#2b2825;font-family:ui-sans-serif,system-ui,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .mute{fill:#7d766c}
  .axis{stroke:#d8d2c8;stroke-width:1}
  .bad{fill:#b4232a} .warn{fill:#c9821a} .ok{fill:#1f7a4d}
  @media (prefers-color-scheme: dark){
    .bg{fill:#17161a} .t{fill:#eceaf2} .mute{fill:#9c97aa} .axis{stroke:#3b3947}
    .bad{fill:#ff8a8a} .warn{fill:#f0b663} .ok{fill:#6ee7a8}
  }
</style>
<rect class="bg" width="760" height="400"/>
<text class="t" x="24" y="28" font-size="15" font-weight="600">横轴是 log₂。每往右一格 32 位 = 难 40 亿倍。</text>
<text class="mute t" x="24" y="48" font-size="12">「本该有的」是 2¹²⁸（12 词）或 2²⁵⁶（24 词）。弱熵把它搬到左边去。</text>

<line class="axis" x1="60" y1="300" x2="724" y2="300"/>
<g class="mute t mono" font-size="10">
  <text x="52" y="318">0</text><text x="130" y="318">32</text><text x="210" y="318">64</text>
  <text x="290" y="318">96</text><text x="368" y="318">128</text><text x="528" y="318">192</text>
  <text x="688" y="318">256</text>
</g>
<g class="axis">
  <line x1="140" y1="296" x2="140" y2="304"/><line x1="220" y1="296" x2="220" y2="304"/>
  <line x1="300" y1="296" x2="300" y2="304"/><line x1="380" y1="296" x2="380" y2="304"/>
  <line x1="540" y1="296" x2="540" y2="304"/><line x1="700" y1="296" x2="700" y2="304"/>
</g>

<g font-size="11.5">
  <rect x="60" y="70"  height="17" fill="#b4232a" opacity=".85">
    <animate attributeName="width" from="0" to="55" dur=".8s" begin="0.1s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="66" font-size="10.5">2²²</text>
  <text class="bad t" x="124" y="83">Coldcard Mk3 — 单张 4090 跑 <tspan font-weight="600">3 秒</tspan>，成本可忽略</text>

  <rect x="60" y="102" height="17" fill="#b4232a" opacity=".85">
    <animate attributeName="width" from="0" to="80" dur=".8s" begin="0.3s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="98" font-size="10.5">2³²</text>
  <text class="bad t" x="149" y="115">bx seed / Trust Wallet 扩展 — <tspan font-weight="600">48 分钟，$0.25</tspan></text>

  <rect x="60" y="134" height="17" fill="#b4232a" opacity=".85">
    <animate attributeName="width" from="0" to="98" dur=".8s" begin="0.5s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="130" font-size="10.5">2³⁹</text>
  <text class="bad t" x="167" y="147">Ill Bloom（128 位请求）— <tspan font-weight="600">4 天</tspan></text>

  <rect x="60" y="166" height="17" fill="#c9821a" opacity=".85">
    <animate attributeName="width" from="0" to="130" dur=".8s" begin="0.7s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="162" font-size="10.5">2⁵²</text>
  <text class="warn t" x="199" y="179">Coldcard Mk4 建模切片 — <tspan font-weight="600">约 95 年，$25 万</tspan></text>

  <rect x="60" y="198" height="17" fill="#1f7a4d" opacity=".85">
    <animate attributeName="width" from="0" to="320" dur="1.1s" begin="0.9s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="194" font-size="10.5">2¹²⁸</text>
  <text class="ok t" x="389" y="211">12 词助记词本该有的</text>

  <rect x="60" y="230" height="17" fill="#1f7a4d" opacity=".85">
    <animate attributeName="width" from="0" to="640" dur="1.4s" begin="1.1s" fill="freeze"/></rect>
  <text class="t mono" x="60" y="226" font-size="10.5">2²⁵⁶</text>
  <text class="ok t" x="60" y="266">24 词助记词本该有的</text>
</g>

<text class="t" x="24" y="352" font-size="12.5" font-weight="600">⚠️ 这张图画不出真实比例。</text>
<text class="mute t" x="24" y="372" font-size="12">按真实比例：如果 2²² 画成 1 毫米，2¹²⁸ 要画 8×10²⁸ 米 —— 约 90 倍可观测宇宙的直径。</text>
<text class="mute t" x="24" y="390" font-size="12">对数尺度是一种善意的谎言。它让你能看见这张图，代价是看不见真正的差距。</text>
</svg>
