<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
     aria-label="时间轴动画：七个案例中，钥匙可被计算的时刻到钥匙真的被计算的时刻之间的间隔，全部以年计">
<title>反应窗口：可被计算 → 真的被计算</title>
<style>
  .bg{fill:#fbfaf8}
  .t{fill:#2b2825;font-family:ui-sans-serif,system-ui,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .mute{fill:#7d766c}
  .grid{stroke:#e8e4dc;stroke-width:1}
  .axis{stroke:#d8d2c8;stroke-width:1}
  .gap{stroke:#c9821a;stroke-width:5;stroke-linecap:round;opacity:.5}
  .dotA{fill:#1f7a4d}  .dotB{fill:#b4232a}
  .hot{stroke:#b4232a;stroke-width:1.5;stroke-dasharray:3 3}
  .bad{fill:#b4232a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#17161a} .t{fill:#eceaf2} .mute{fill:#9c97aa}
    .grid{stroke:#2a2933} .axis{stroke:#3b3947}
    .gap{stroke:#f0b663} .dotA{fill:#6ee7a8} .dotB{fill:#ff8a8a}
    .hot{stroke:#ff8a8a} .bad{fill:#ff8a8a}
  }
  @keyframes draw{0%{stroke-dasharray:0 600}100%{stroke-dasharray:600 0}}
  @keyframes pop{0%{opacity:0;r:0}100%{opacity:1}}
  @keyframes fadein{0%{opacity:0}100%{opacity:1}}
  .g{animation:draw 1s ease both}
  .b{animation:pop .4s ease both}
  .lbl{animation:fadein .6s ease both}
  #conv{animation:fadein 1s ease both;animation-delay:2.6s}
  @media (prefers-reduced-motion: reduce){.g,.b,.lbl,#conv{animation:none;opacity:1;stroke-dasharray:none}}
</style>
<rect class="bg" width="760" height="400"/>
<text class="t" x="24" y="28" font-size="15" font-weight="600">反应窗口 = 从「钥匙可以被算出来」到「真的有人算了它」</text>
<text class="mute t" x="24" y="48" font-size="12"><tspan class="dotA" font-weight="600">●</tspan> 可被计算   <tspan class="dotB" font-weight="600">●</tspan> 真的被扫   这是唯一值得长期盯的数 —— 它趋近于零的那天，性质就变了。</text>
<line class="grid" x1="212.9" y1="72" x2="212.9" y2="316"/>
<text class="mute t mono" x="201.9" y="332" font-size="10">2014</text>
<line class="grid" x1="280.4" y1="72" x2="280.4" y2="316"/>
<text class="mute t mono" x="269.4" y="332" font-size="10">2016</text>
<line class="grid" x1="348.0" y1="72" x2="348.0" y2="316"/>
<text class="mute t mono" x="337.0" y="332" font-size="10">2018</text>
<line class="grid" x1="415.6" y1="72" x2="415.6" y2="316"/>
<text class="mute t mono" x="404.6" y="332" font-size="10">2020</text>
<line class="grid" x1="483.1" y1="72" x2="483.1" y2="316"/>
<text class="mute t mono" x="472.1" y="332" font-size="10">2022</text>
<line class="grid" x1="550.7" y1="72" x2="550.7" y2="316"/>
<text class="mute t mono" x="539.7" y="332" font-size="10">2024</text>
<line class="grid" x1="618.2" y1="72" x2="618.2" y2="316"/>
<text class="mute t mono" x="607.2" y="332" font-size="10">2026</text>
<text class="t" x="24" y="96" font-size="11.5">脑钱包</text>
<line class="gap g" x1="263.6" y1="92" x2="266.9" y2="92" style="animation-delay:0.25s"/>
<circle class="dotA b" cx="263.6" cy="92" r="4.5" style="animation-delay:0.25s"/>
<circle class="dotB b" cx="266.9" cy="92" r="4.5" style="animation-delay:1.15s"/>
<text class="t lbl mono" x="276.9" y="96" font-size="10.5" style="animation-delay:1.25s">≈0</text>
<text class="t" x="24" y="130" font-size="11.5">未知软件 / 256 位</text>
<line class="gap g" x1="381.8" y1="126" x2="449.0" y2="126" style="animation-delay:0.55s"/>
<circle class="dotA b" cx="381.8" cy="126" r="4.5" style="animation-delay:0.55s"/>
<circle class="dotB b" cx="449.0" cy="126" r="4.5" style="animation-delay:1.45s"/>
<text class="t lbl mono" x="459.0" y="130" font-size="10.5" style="animation-delay:1.55s">1–2 年</text>
<text class="t" x="24" y="164" font-size="11.5">Cake Wallet</text>
<line class="gap g" x1="462.8" y1="160" x2="564.2" y2="160" style="animation-delay:0.85s"/>
<circle class="dotA b" cx="462.8" cy="160" r="4.5" style="animation-delay:0.85s"/>
<circle class="dotB b" cx="564.2" cy="160" r="4.5" style="animation-delay:1.75s"/>
<text class="t lbl mono" x="574.2" y="164" font-size="10.5" style="animation-delay:1.85s">约 3 年</text>
<text class="t" x="24" y="198" font-size="11.5">227k 集群</text>
<line class="gap g" x1="348.0" y1="194" x2="530.4" y2="194" style="animation-delay:1.15s"/>
<circle class="dotA b" cx="348.0" cy="194" r="4.5" style="animation-delay:1.15s"/>
<circle class="dotB b" cx="530.4" cy="194" r="4.5" style="animation-delay:2.05s"/>
<text class="t lbl mono" x="540.4" y="198" font-size="10.5" style="animation-delay:2.15s">约 5 年</text>
<text class="t" x="24" y="232" font-size="11.5">Coldcard</text>
<line class="gap g" x1="456.1" y1="228" x2="635.1" y2="228" style="animation-delay:1.45s"/>
<circle class="dotA b" cx="456.1" cy="228" r="4.5" style="animation-delay:1.45s"/>
<circle class="dotB b" cx="635.1" cy="228" r="4.5" style="animation-delay:2.35s"/>
<text class="t lbl mono" x="645.1" y="232" font-size="10.5" style="animation-delay:2.45s">约 5 年</text>
<text class="t" x="24" y="266" font-size="11.5">bx + Trust Wallet iOS</text>
<line class="gap g" x1="331.1" y1="262" x2="534.8" y2="262" style="animation-delay:1.75s"/>
<circle class="dotA b" cx="331.1" cy="262" r="4.5" style="animation-delay:1.75s"/>
<circle class="dotB b" cx="534.8" cy="262" r="4.5" style="animation-delay:2.65s"/>
<text class="t lbl mono" x="544.8" y="266" font-size="10.5" style="animation-delay:2.75s">5–6 年</text>
<text class="t" x="24" y="300" font-size="11.5">Ill Bloom</text>
<line class="gap g" x1="212.9" y1="296" x2="631.7" y2="296" style="animation-delay:2.05s"/>
<circle class="dotA b" cx="212.9" cy="296" r="4.5" style="animation-delay:2.05s"/>
<circle class="dotB b" cx="631.7" cy="296" r="4.5" style="animation-delay:2.95s"/>
<text class="t lbl mono" x="641.7" y="300" font-size="10.5" style="animation-delay:3.05s">8–12 年</text>
<g id="conv">
<line class="hot" x1="534.8" y1="72" x2="534.8" y2="316"/>
<text class="bad t" x="414.8" y="66" font-size="11" font-weight="600">2023-07-12</text>
</g>
<text class="t" x="24" y="348" font-size="12.5" font-weight="600">
  2023-07-12：两个不同的软件、两个不同的 PRNG 缺陷、两个不同年份的受害群体，<tspan class="bad">同一天收割。</tspan></text>
<text class="mute t" x="24" y="368" font-size="11.5">
  那不是一次事故，那是一个武器库 —— 有人维护着一组弱钥匙生成器，预先算好，选时间统一动手。</text>
<text class="mute t" x="24" y="386" font-size="11">
  ⚠️ 7 个数据点的方向性观察，不是统计结论。混淆因素：防守方人力极少。</text>
</svg>
